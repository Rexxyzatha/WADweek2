<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Bengkel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .form-container { max-width: 700px; margin: auto; }
        .card-custom { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
    </style>
</head>
<body>
    <div class="container mt-5 form-container">
        <div class="card card-custom p-4">
            <h4 class="fw-bold mb-4 text-gray-800">Tambah Bengkel Mitra Baru</h4>

            <!-- Form input dengan class Bootstrap -->
            <form action="{{ route('bengkel.store') }}" method="POST">
                @admin bengkel
                
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Nama Bengkel</label>
                    <input type="text" name="nama_bengkel" class="form-control" placeholder="Contoh: Auto Fix Sentosa" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Lokasi (Alamat)</label>
                    <textarea name="lokasi" rows="3" class="form-control" placeholder="Alamat lengkap bengkel" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Kontak</label>
                    <input type="text" name="kontak" class="form-control" placeholder="No. Telepon / WhatsApp" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary">Jenis Layanan</label>
                    <input type="text" name="jenis_layanan" class="form-control" placeholder="Contoh: Ganti Oli, Tune Up, Cuci Mobil" required>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ route('bengkel.index') }}" class="btn btn-light border shadow-sm text-secondary">Batal</a>
                    <button type="submit" class="btn btn-primary shadow-sm px-4">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
